<!doctype html>
<!-- Dev check for snap-to-vanish without a camera: npm run dev, open /tests/vanish-harness.html?char=void
     The test photo plays as a live video; window.__v.toggle() vanishes / brings you back. -->
<meta charset="utf-8">
<title>Vanish harness</title>
<style>body{margin:0;background:#111;color:#ddd;font:13px system-ui}canvas{width:100%;display:block}#s{padding:8px}</style>
<div id="s">Loading</div>
<canvas id="out"></canvas>
<script type="module">
  import { Engine } from '/src/engine.ts';
  import { Vision } from '/src/vision.ts';
  import { CHARACTERS } from '/src/characters.ts';

  const img = new Image();
  img.src = '/fixtures/face.jpg';
  await img.decode();
  const w = img.naturalWidth, h = img.naturalHeight;
  const cam = document.createElement('canvas');
  cam.width = w;
  cam.height = h;
  const c = cam.getContext('2d');
  setInterval(() => c.drawImage(img, 0, 0), 33);
  const video = document.createElement('video');
  video.muted = true;
  video.srcObject = cam.captureStream(30);
  await video.play();

  const vision = new Vision();
  await vision.init((m) => (document.getElementById('s').textContent = m), '/');
  const engine = new Engine(document.createElement('canvas'), vision);
  engine.renderer.resize(w, h, 1);
  engine.setSource(video, w, h, false);
  engine.fullFrame = true;
  engine.character = Math.max(0, CHARACTERS.findIndex((x) => x.id === new URLSearchParams(location.search).get('char')));

  const out = document.getElementById('out');
  out.width = w;
  out.height = h;
  const o = out.getContext('2d');
  setInterval(() => {
    engine.step(performance.now());
    o.setTransform(-1, 0, 0, 1, w, 0);
    o.drawImage(engine.renderer.canvas, 0, 0);
    engine.drawVanish(o, 'image');
    document.getElementById('s').textContent = `state: ${engine.vanish.state}`;
  }, 33);
  window.__v = { toggle: () => engine.toggleVanish(), state: () => engine.vanish.state };
</script>
